# 前端 nginx 配置：托管 dist + 反代 /api 到后端
# 注意：后端 context-path 为 /api，代理时保持路径透传（不 rewrite）
# 部署产物路径前缀由环境变量 APP_DEPLOY_PATH 决定（默认 /deploy），
# 由 docker/frontend/entrypoint.sh 在启动时替换 __DEPLOY_PATH__ 生成实际配置。

server {
    listen 80;
    server_name _;

    # 前端静态资源
    root /usr/share/nginx/html;
    index index.html;

    # gzip
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 前端路由（React Router history 模式）
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 部署产物：__DEPLOY_PATH__/{deployKey}/... → /usr/share/nginx/deploy/{deployKey}/...
    # 由后端部署功能写入 data/code_deploy（compose 挂载到本容器同路径）
    location __DEPLOY_PATH__/ {
        alias /usr/share/nginx/deploy/;
        index index.html;
        # 目录访问时回退到该部署项目的 index.html；都不存在则 404
        try_files $uri $uri/index.html =404;
        autoindex off;
    }

    # 后端 API 反向代理（含 SSE 流式响应，需关闭缓冲）
    location /api/ {
        proxy_pass http://backend:8911;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 长连接：禁用缓冲，保证流式逐块推送
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
