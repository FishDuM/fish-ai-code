spring:
  application:
    name: fish-ai-code
  threads:
    virtual:
      enabled: true
  session:
    store-type: redis
    # session 7 天过期
    timeout: 604800
#  datasource:
#    driver-class-name: com.mysql.cj.jdbc.Driver
#    url: jdbc:mysql://localhost:3306/fish_ai_code
#    username:
#    password:
  # redis
#  data:
#    redis:
#      host: localhost
#      port: 6379
#      ttl: 3600
#      database: 0
  profiles:
    active: local

server:
  port: 8911
  servlet:
    context-path: /api
    # cookie 7 天过期
    session:
      cookie:
        max-age: 604800
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  # 主站 Origin（浏览器访问的地址）；同源部署可不配置
  origin: ${APP_ORIGIN:}
  # CORS 白名单（逗号分隔）。必须同时包含主站与预览域：
  # 预览 iframe 内的 Vue 静态资源（<script type="module" crossorigin>）是带 Origin 的跨域请求，
  # 预览域不在白名单时 Spring 会返回 403，预览 JS 加载失败、只剩 CSS 背景。生产由环境变量覆盖。
  # 注意：显式配置时以显式值为准；未配置（空值）时后端自动合并 origin + preview-origin，
  # 不会被空环境变量覆盖（见 CorsConfig）。
  cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  preview-origin: ${PREVIEW_ORIGIN:http://preview.localhost:3000}
  preview-frame-ancestor: ${APP_ORIGIN:http://localhost:3000}
  preview-connect-src: "${PREVIEW_CONNECT_SRC:'self'}"

# 应用部署配置（默认值见 AppDeployProperties，可不配置）
# app:
#   deploy:
#     host: http://localhost
#     key-length: 16

# AI 生成的 Vue 项目只能在一次性 Docker 容器中离线构建，绝不在宿主机执行 npm。
# 使用 docker/vue-builder/Dockerfile 预热依赖缓存；运行时网络永久关闭。
vue-build:
  docker-image: fish-ai-code-vue-builder:20
  timeout-seconds: 180
  memory-mb: 1024
  cpu-limit: 1
  max-workspace-mb: 768
  pids-limit: 128
  max-output-mb: 100
  max-output-files: 10000

# springdoc-openapi
springdoc:
  group-configs:
    - group: 'default'
      packages-to-scan: hk.ljx.fishaicode.controller
# knife4j
knife4j:
  enable: true
  setting:
    language: zh_cn

